# tmux: link ~/.config/tmux/tmux.conf -> ~/.source/config/tmux/tmux.conf
# Cola: cheats tmux (ou Super+F1). Recarregar depois de editar: prefixo r

# ------------------------------------------------------------------ prefixo
# Ctrl+a no lugar de Ctrl+b. Para mandar Ctrl+a ao shell (começo da linha): Ctrl+a a
unbind C-b
set -g prefix C-a
bind a send-prefix
bind C-a last-window              # Ctrl+a Ctrl+a: alterna com a última janela

# ------------------------------------------------------------------ terminal e nvim
set -g default-terminal "tmux-256color"
set -as terminal-features ",st-256color:RGB,xterm-256color:RGB"   # cores de 24 bits
set -sg escape-time 0             # Esc instantâneo no nvim (padrão: 500 ms)
set -g focus-events on            # nvim percebe quando o painel ganha/perde foco
set -g history-limit 50000
set -g mouse on                   # clicar escolhe painel, arrastar a borda redimensiona, roda rola

# ------------------------------------------------------------------ numeração (igual ao teclado)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on        # fechou a 2? a 3 vira 2

# ------------------------------------------------------------------ janelas e painéis
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"   # lado a lado, na mesma pasta
bind - split-window -v -c "#{pane_current_path}"   # em cima e embaixo, na mesma pasta
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5        # -r: depois do prefixo, repita H H H sem o prefixo
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

bind BSpace switch-client -l      # volta para a sessão anterior

# ------------------------------------------------------------------ copiar (como no vim)
# prefixo [ entra no modo cópia; v seleciona; y copia para a área de transferência
setw -g mode-keys vi
set -s copy-command "xclip -selection clipboard -in"   # duplo clique, Enter etc. também copiam para o Ctrl+V
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# ------------------------------------------------------------------ utilidades
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf recarregado"
bind f run-shell -b "tmux-sessionizer"   # escolher projeto no dmenu (também: Super+O no dwm)

# ------------------------------------------------------------------ aparência (tema padrão)
set -g status-position bottom
set -g status-style "bg=#16181c,fg=#a9afb8"
set -g status-left "#[fg=#8fb4d8] #S #[default] "
set -g status-left-length 30
set -g status-right "#{?client_prefix,#[fg=#d4b878]PREFIXO ,}#[fg=#7c828d]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#262a31,fg=#d4d7dc] #I #W "
set -g pane-border-style "fg=#3a3f48"
set -g pane-active-border-style "fg=#8fb4d8"
set -g message-style "bg=#262a31,fg=#d4d7dc"
setw -g mode-style "bg=#262a31,fg=#d4d7dc"
set -g display-panes-active-colour "#8fb4d8"
set -g display-panes-colour "#3a3f48"
